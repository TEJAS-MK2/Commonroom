name: Validate and deploy Chat

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Validate JavaScript module syntax
        run: node --input-type=module --check < app.js
      - name: Scan browser assets for privileged Supabase keys
        run: |
          if grep -En 'sb_secret_|SUPABASE_SERVICE_ROLE|service_role:' app.js index.html styles.css; then
            echo "Privileged Supabase credentials must never ship to the browser."
            exit 1
          fi
          echo "Browser asset secret scan passed."
      - name: Validate HTML structure and required elements
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class PageParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = set()
                  self.errors = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if "id" in attrs:
                      if attrs["id"] in self.ids:
                          self.errors.append(f"duplicate id: {attrs['id']}")
                      self.ids.add(attrs["id"])
          parser = PageParser()
          parser.feed(Path("index.html").read_text(encoding="utf-8"))
          required = {"chat-screen", "room-list", "room-count", "new-room", "messages", "message-form", "message-input", "send-button", "change-name", "my-name", "my-avatar", "online-count", "toast", "reply-context", "emoji-picker", "profile-popover"}
          missing = required - parser.ids
          if parser.errors or missing:
              raise SystemExit("; ".join(parser.errors + ([f"missing ids: {sorted(missing)}"] if missing else [])))
          print(f"HTML smoke check passed: {len(parser.ids)} unique IDs.")
          PY
      - name: Check client configuration for secret keys
        run: |
          python - <<'PY'
          from pathlib import Path
          config = Path("supabase/config.js").read_text(encoding="utf-8")
          forbidden = ("sb_secret_", "SUPABASE_SERVICE_ROLE", "service_role:")
          if any(token in config for token in forbidden):
              raise SystemExit("A privileged Supabase key must never be shipped to the browser.")
          if "SUPABASE_URL" not in config or "SUPABASE_PUBLISHABLE_KEY" not in config:
              raise SystemExit("Supabase browser configuration is incomplete.")
          print("Browser configuration smoke check passed.")
          PY
      - name: Assemble static site
        run: |
          mkdir -p _site/supabase
          cp index.html styles.css app.js _site/
          cp supabase/config.js _site/supabase/
          touch _site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
